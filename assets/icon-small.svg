<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ロゴ D の小さい版。32px 未満（ICO の 16・20・24）だけをこれで描く（tools/icon-render.js）。
       形は assets/icon.svg と同じ。16px でも箱の上の波が見えるように、波を太く高く（山と谷を大きく）し、枠と N も少し太くする。
