  <path d="M5 16 Q5 5 16 5 H22 L27 3.5 L32 12 L37 3.5 L42 10 L46 5 H48 Q59 5 59 16 V48 Q59 59 48 59 H16 Q5 59 5 48 Z" fill="#ffffff" stroke="#151515" stroke-width="5.5" stroke-linejoin="round"/>
  <path d="M22 5 L27 3.5 L32 12 L37 3.5 L42 10 L46 5" fill="none" stroke="#0e8cae" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22 45V21 L42 45V21" fill="none" stroke="#151515" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
