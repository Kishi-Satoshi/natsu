<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>NaTsu Overlay</title>
<style>
  /* 0.9.0 O-3（設計書 D25・RP5〜RP7）: 会議の録音でよく見る形に寄せた小さな暗いピル。ロゴ・ちょうど5つの点・相手の声の印・経過時間・
     ［一時停止］・赤い［停止］。横（上・下の6か所）と縦（左右の中央）の2つの形。明るいデスクトップでも暗いデスクトップでも同じ暗い地。
     窓の大きさは main がピルの大きさ（reportSize）に合わせる（ピルは窓の幅に縮まない: flex: none・max-content） */
  :root {
    --bg: #262626;
    --fg: #f2f2f2;
    --dim: rgba(255, 255, 255, 0.62);
    --btn: rgba(255, 255, 255, 0.12);
    --rec: #e5484d;
    --warn: #f5a524;
    --err: #ff8a80;
    --sea: #0e8cae;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; height: 100%; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
  }
  .pill {
    position: relative;
    flex: none; width: max-content;
    display: flex; align-items: center; gap: 10px;
    height: 40px;
    padding: 0 5px 0 10px;
    -webkit-app-region: drag;   /* ピル全体をドラッグで移動可能に（離すと main が一番近い置き場所に吸い付ける） */
    background: #262626;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px;
    /* 外向きの影は付けない。Windows の透過ウィンドウでは影がウィンドウの
       矩形いっぱいに落ち、ピルの外側にうっすら灰色の四角が見える（実機で発生）。
       浮きは内側のハイライトと縁のコントラストだけで出す。 */
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
    /* backdrop-filter も使わない。透過ウィンドウでは背後の合成結果が
       矩形に出ることがある。地の色を十分濃くして代わりにする。 */
    color: var(--fg);
    opacity: 0; transform: translateY(10px) scale(.97);
    transition: opacity .18s ease, transform .22s cubic-bezier(.2, .9, .3, 1.2);
  }
  .pill.visible { opacity: 1; transform: none; }
  /* 0.9.4 P-1（持ち主の答え「そのまますっと消える」）: 止めた・済んだときは約 0.4 秒で薄くなって消える（完了の印も「保存しました」も出さない） */
  .pill.leaving { transition: opacity .4s ease, transform .4s ease; }
  .pill[data-form="v"] { flex-direction: column; width: 40px; height: max-content; padding: 10px 0 5px; }

  /* ロゴ（assets/icon.svg と同じ2本の path。0.11.1 で箱の中のリスに替えた）と、既定のマイクで代替しているときの角の黄色い点 */
  .mark { position: relative; width: 20px; height: 20px; flex: none; }
  .logo { width: 20px; height: 20px; display: block; }
  /* 暗いピルなので、いつも白い箱に黒いリス（リスはピルの地の色。持ち主の答え LG2・LG6） */
  .logo .logo-box { fill: #ffffff; }
  .logo .logo-sq { fill: var(--bg); }
  .badge { position: absolute; right: -3px; bottom: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--warn); border: 2px solid var(--bg); }

  /* 音の大きさ: ちょうど5つの点。無音は同じ 4px の点、声が入ると5本がそれぞれ揺れる（0.9.4 W-1。縦の形は横へ）。長さは --l（renderLevel） */
  .lv { display: flex; align-items: center; justify-content: center; gap: 3px; flex: none; width: 32px; height: 20px; }
  .pill[data-form="v"] .lv { flex-direction: column; width: 20px; height: 32px; }
  .lv i { --l: 4px; display: block; width: 4px; height: var(--l); border-radius: 2px; background: var(--fg); }
  .pill[data-form="v"] .lv i { width: var(--l); height: 4px; }
  .pill.paused .lv i { background: rgba(255, 255, 255, 0.45); }
  .pill.warn .lv i { background: var(--warn); }

  .timer {
    flex: none; font-size: 13px; font-variant-numeric: tabular-nums;
    color: var(--fg); letter-spacing: .02em; min-width: 38px; text-align: center;
  }
  .pill[data-form="v"] .timer { font-size: 10.5px; min-width: 0; letter-spacing: 0; }
  .pill.paused .timer { color: var(--dim); }

  /* 一時的な短い文（無音の警告・代替のマイク・相手の声を録れない・作成中・完了・エラー）。長い文は「…」で切る */
  .msg { flex: none; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--fg); padding-right: 8px; }
  .msg:empty { display: none; }
  .msg.warn { color: var(--warn); }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--fg); }
  .pill[data-form="v"] .msg { display: none; }
  .pill[data-form="v"][data-phase="processing"] .msg,
  .pill[data-form="v"][data-phase="done"] .msg,
  .pill[data-form="v"][data-phase="error"] .msg {
    /* 縦書きは1字ずつ折り返して並べる（writing-mode: vertical-rl は縦の列の中で高さを測り違え、字が重なった: O-3 で撮った画像で見つけた）。
       横向きの字（「ー」「…」）は showPhaseText が縦向きの字（「︱」「︙」）に替えて入れる。「…」「︙」は行の頭に置けない字（禁則）なので、
       word-break だけでは前の字の横に並ぶ。line-break: anywhere でどの字の間でも折り返し、幅はいちばん広い1字（min-content）にする。
       縦向きの字は日本語の書体から先に取る */
    display: block; width: min-content; max-width: none; white-space: normal; word-break: break-all; line-break: anywhere; text-align: center; overflow: visible; text-overflow: clip;
    font-family: "Yu Gothic UI", "Meiryo UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.25; max-height: 200px; padding: 0 0 6px;
  }

  /* 作成中は回る輪（0.9.4 P-1: 完了の緑の丸の印は無くした）。録音中の部品（点・時間・ボタン）は録音中だけ */
  .spin { display: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.18); border-top-color: var(--sea); flex: none; }
  .pill[data-phase="processing"] .spin { display: block; animation: spin .8s linear infinite; }
  .pill:not([data-phase="recording"]) .lv,
  .pill:not([data-phase="recording"]) .timer { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .pill, .pill .spin, .lv i { animation: none !important; transition: none !important; }
  }

  .btns { display: none; gap: 4px; flex: none; }
  .pill[data-phase="recording"] .btns { display: flex; }
  .pill[data-form="v"] .btns { flex-direction: column; }
  .pbtn {
    -webkit-app-region: no-drag;
    width: 28px; height: 28px; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; line-height: 1; padding: 0;
    background: var(--btn); color: var(--fg);
    transition: transform .08s ease, background .12s ease;
  }
  .pbtn[hidden] { display: none; }
  .pbtn:hover { background: rgba(255, 255, 255, 0.22); }
  .pbtn:active { transform: scale(.92); }
  /* 窓はフォーカスを取らない（focusable: false）が、輪は本物の button と同じに持つ */
  .pbtn:focus-visible { outline: 2px solid var(--fg); outline-offset: 1px; }
  .pbtn .bar { width: 3px; height: 11px; border-radius: 1.5px; background: var(--fg); display: block; }
  .pause-ico { display: flex; gap: 3px; }
  .pill.paused .pause-ico { display: none; }
  /* 再開の三角は一時停止中だけ（.pbtn .tri の display: block より強くする） */
  .pbtn .resume-ico { display: none; }
  .pill.paused .pbtn .resume-ico { display: block; }
  /* 一時停止中は白い丸の［▶］ */
  .pill.paused .pbtn.pause { background: #f2f2f2; }
  .pbtn .tri { width: 0; height: 0;
    border-left: 9px solid; border-left-color: #1f1f1f; border-top: 5.5px solid transparent;
    border-bottom: 5.5px solid transparent; margin-left: 2px; }
  /* 停止: 赤い丸に白い四角。ここで記録が締まるので、いちばん強い色にする */
  .pbtn.stop { background: var(--rec); }
  .pbtn.stop:hover { background: #d93d42; }
  .pbtn .sq { width: 10px; height: 10px; border-radius: 2px; background: #fff; display: block; }
  /* 音声入力（1本録り）は一時停止しない。短い発話が前提で、
     区間の概念も無いため、止める＝確定でよい */
  .pill:not(.meeting) .pbtn.pause { display: none; }
  /* 破棄は音声入力だけ。議事録は誤操作で会議が消えるので画面には出さない
     （破棄はメイン画面の「破棄」ボタンから、確認つきで行う） */
  .pbtn.ng { color: rgba(255, 255, 255, 0.75); }
  .pbtn.ng:hover { color: #fff; }
  .pill.meeting .pbtn.ng { display: none; }

  /* 0.9.0 O-4（RP8・決めたこと 23）: 縦の形の × （録音バーを隠す。録音は続ける）。カーソルが乗っている間だけ右上に出す。
     「乗った」は main がカーソルを見て送る（.pill.hover。ピルはドラッグの領域なので、Windows では :hover が来ない）。:hover はボタンの上で効く。
     ピルの角からはみ出す分は、窓の周りの余白（PANEL_PAD）が飲む。横の形には出さない */
  .hide {
    display: none; position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
    border: none; padding: 0; cursor: pointer; align-items: center; justify-content: center;
    font-size: 10px; line-height: 1; background: #3a3a3a; color: var(--fg);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
  }
  #hideBtn { -webkit-app-region: no-drag; }
  .pill[data-form="v"][data-phase="recording"].hover .hide,
  .pill[data-form="v"][data-phase="recording"]:hover .hide { display: flex; }
  .hide:hover { background: #4a4a4a; }
  .hide:focus-visible { outline: 2px solid var(--fg); outline-offset: 1px; }
</style>
</head>

<script>
(() => {
  const DICTATION_MAX_MS = 10 * 60 * 1000;

  const pill = document.getElementById('pill');
  const statusEl = document.getElementById('status');
  const timerEl = document.getElementById('timer');
  // 0.9.0 O-3: 5つの点・相手の声の印・代替のマイクの角の点・ボタン
  const lvDots = Array.from(document.getElementById('lv').children);
  const badgeEl = document.getElementById('micBadge');
  const pauseBtn = document.getElementById('pauseBtn');
  const stopBtn = document.getElementById('stopBtn');
  const ngBtn = document.getElementById('ngBtn');
  const hideBtn = document.getElementById('hideBtn');   // 0.9.0 O-4: 縦の形の ×

  let mode = 'dictation'; // 'dictation' | 'meeting'
  let segmentMs = 75000;
  let segDeadline = 0;   // この時刻を過ぎたら区間を切る（setTimeout の保険）
  let paused = false;     // 一時停止中（録音は止まるが、記録は捨てない）
  let pausedAt = 0;       // 一時停止した時刻
  let pausedMs = 0;       // 一時停止していた合計。経過時間の表示から差し引く
  const FIRST_SEG_MS = 20000; // 最初のセグメントは短くして早く結果を見せる
  let firstSegDone = false;
  // mediaStream は MediaRecorder に渡すもの。相手の声を混ぜているときは
  // 合成後のストリームになるので、マイクの解放は micStream で行う。
  // ここを一本にまとめると、録音終了後もマイクが開きっぱなしになる。
  let mediaStream = null;
  let micStream = null;    // getUserMedia の生ストリーム（マイクの解放責任）
  let sysStream = null;    // getDisplayMedia の生ストリーム（相手の声）
  let sysAnalyser = null;
  // 0.12.0 SP-2（D66・決めたこと 120〜122・130・134・146）: 相手の声を取り込む議事録は、マイクと相手の声を別々の MediaRecorder で録る（2つの流れ）。
  // マイクの流れは今の区間の道（recorder・segSeq・sendQueue・segClosing）をそのまま使い、相手の声の流れは sys に持つ。区間ごとに
  // 4つ目 { src, seg, t0, last } を付けて送る（src は 'mic'・'loopback'・''。seg は流れごとの番号・t0 は「録っている時間」の時計・last はその流れの最後）
  let twoEver = false;     // この録音で2つの流れになったか（以後のマイクの区間は4つ目を付けて送る。取り込みが切れても続ける）
  let sysDest = null;      // 相手の声の流れの出口（1ch）。MediaRecorder はここから録る
  let micVoice = null;     // 声の切れ目を見る analyser（点と印の analyser とは別。main の vadStep が見る）
  let sysVoice = null;

    // マイクは必須。ここが失敗したら start() が握って中止する。
    micStream = await navigator.mediaDevices.getUserMedia({ audio });
    checkMicChoice();   // 開き直すたびに見る（一時停止→再開の間に機器が抜き差しされる）

    audioCtx = new AudioContext();
    audioCtx.resume().catch(() => {});
    const micSrc = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.6;
    micSrc.connect(analyser);

    if (sysStream) {
      // 0.12.0 SP-2（D66・決めたこと 120）: 混ぜずに別々に録る。マイクの流れはエコー消し・雑音消し・自動の音量のかかった micStream のまま
      // [マイク] ─┬→ analyser（点）・micVoice（声の切れ目）
      //           └→ MediaRecorder（micStream）
      // [相手の声] → sysGain ─┬→ sysDest(1ch) → MediaRecorder
      //                       ├→ sysAnalyser（点）
      //                       └→ sysVoice（声の切れ目）
      sysGain = audioCtx.createGain(); sysGain.gain.value = 1.0;
      // ここでモノラルに確定させる（相手の声が 2ch でも取りこぼさない）
      sysDest = audioCtx.createMediaStreamDestination();
      try {
        sysDest.channelCount = 1;
        sysDest.channelCountMode = 'explicit';
      } catch (_) { /* 実装差。下流の blobToWav16k が 1ch に落とすので致命ではない */ }

      const sysSrc = audioCtx.createMediaStreamSource(sysStream);
      sysAnalyser = audioCtx.createAnalyser();
      sysAnalyser.fftSize = 512;
      sysAnalyser.smoothingTimeConstant = 0.6;

      sysSrc.connect(sysGain).connect(sysDest);
      sysGain.connect(sysAnalyser);
      // 声の切れ目を見る analyser（決めたこと 146: 約 85ms の窓。点と印の analyser の値は変えない）
      micVoice = audioCtx.createAnalyser();
      micVoice.fftSize = 4096;
      micSrc.connect(micVoice);
      sysVoice = audioCtx.createAnalyser();
      sysVoice.fftSize = 4096;
      sysGain.connect(sysVoice);

      // 開始のビープはスピーカーへ出る＝ループバックにも乗る。
      // 閉じるのはビープを鳴らす瞬間（start 側の muteSystemForBeep）。
      // ここで閉じてしまうと、下のチャンネル数待ちの分だけ先に明けてしまう。

      // 途中で取り込みが切れてもマイクだけで録り続ける。
      // 0.12.0 SP-2（決めたこと 122）: 相手の声の流れはその時の区間を締めて送り（その流れの最後）、マイクの流れは続ける
      const st = sysStream.getAudioTracks()[0];
      st.addEventListener('ended', () => {
        if (!sysOn) return;                  // releaseStream の stop() では発火しないが念のため
        sysAnalyser = null; sysOn = false;
        sysGain = null;
        sysVoice = null;
        endSysLane();
        // 報告し直さないと、以後マイクしか録れていないのに
        // アプリのバーが「相手の声も」と言い続ける。0.9.4 P-1: 録音バーは「相手の声を録れません」を出したままにする
        window.koeOverlay.reportSource(false, true);
        sysNg = true;
        applySysNg();
        if (!statusEl.textContent) flashMsg('');
        // 次のフレームで checkSilence が出すべき文言を決め直す
        shownLabel = null;
      });

      mediaStream = micStream;   // マイクの流れ（今の区間の道が録る）
      twoEver = true;
      // Chromium は音が1量子流れるまで、この出力を 2ch と名乗り続けることがある。
      // その状態で MediaRecorder を作るとステレオで確定し、32kbps を左右で
      // 分け合ってしまう。最大 200ms だけ待つ（分からない実装では待たない）。
      const track = sysDest.stream.getAudioTracks()[0];
      for (let i = 0; i < 20; i++) {
        const ch = track.getSettings ? track.getSettings().channelCount : 1;
        if (typeof ch !== 'number' || ch === 1) break;
        await new Promise((r) => setTimeout(r, 10));
      }
    } else {
      mediaStream = micStream;   // 従来どおりの1本録り
    }

    // 待っている間に「終了」「破棄」が押されていることがある。
    // ここで表示を 'recording' に戻すと、押した後なのに録音中に見えるうえ、
    // 二度と録音を始められなくなる（表示の状態を起動条件に使っていた頃の名残）。
    if (cancelled || stopping) return;
    if (sysWanted) window.koeOverlay.reportSource(sysOn, true);
    showRecording('');
    // 0.9.0 O-3（RP6）: 代替のマイクはロゴの角の点とはじめの 4 秒の文。0.9.4 P-1: 相手の声を録れないときは文を録音中ずっと（縦の形は角の点と説明の文）
    sysNg = sysWanted && !sysOn;
    applySysNg();
    if (micFallback) flashMsg('既定のマイクで録音中', 'warn', 4000);
    else if (sysNg) flashMsg('');
    meterFrame();
  }

  // 開始・停止のビープが相手の声として録音に混ざらないよう、鳴らす前後だけ閉じる
  function muteSystemForBeep() {
    if (!sysGain || !audioCtx) return;
    const t = audioCtx.currentTime;
    sysGain.gain.setValueAtTime(0, t);
    sysGain.gain.setValueAtTime(1.0, t + 0.3);
  }

  // sink: 録れたデータを溜める配列。呼び手が区間ごとに持つ。
  // モジュール変数 chunks に直接 push すると、区間の切り替えや cleanup で
  // 配列が差し替わったあとに届いた onstop が別の区間の中身を読む。
  function newRecorder(sink) {
    const mime = pickMime();
    const rec = new MediaRecorder(
      mediaStream,
      mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 },
    );
    rec.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) sink.push(e.data);
      cutSegmentIfOverdue(rec);
    };
    return rec;
  }

  async function start() {
    cleanup();            // 立っていれば starting もここで倒れる
    starting = true;      // openStream を待っている間の二重起動を止める
    cancelled = false;
    stopping = false;
    chunks = [];
    segDeadline = 0;
    silentSince = 0;
    micSilentSince = 0;
    paused = false; pausedAt = 0; pausedMs = 0;
    segClosing = null;    // 前回の締めが残っていると、一時停止中の終了が何も送らなくなる
    session++;            // 前の録音の区間（まだ変換待ち）が、この録音のマイクや区間に触らないための印
    // 前の録音の待ち行列は捨てる。前の録音の区間は session の印で空として埋まるが、
    // 番号が埋まらないまま終わった録音（マイクの切断で start() が投げた等）が残っていると、
    // この録音の区間が永久に届かない
    sendQueue.clear(); sendNext = segSeq; errorAfterFinal = '';
    resetLanes();         // 0.12.0 SP-2: 2つの流れの番号と印（相手の声の流れの待ち行列も捨てる）
    micFallback = false;  // openStream が開いたトラックを見て決め直す
    pill.classList.remove('paused');
    shownLabel = '';
    firstSegDone = false;
    // 0.9.0 O-3: 前の録音の文・印・点を消してから始める（取り込みの成否が決まったら openStream が印を貼り直す）
    sysNg = false;
    flashMsg('');
    setShown(badgeEl, false);
    applySysNg();
    renderLevel(0);
    showRecording('');
    timerEl.textContent = '0:00';
    pill.classList.toggle('meeting', mode === 'meeting');
    setButtonNames();
    reportSize();

    try {
      await openStream();
    } catch (e) {
      // 相手の声を先に開いていることがある。閉じないと画面キャプチャが残る。
      cleanup();
      // 議事録なら main は「最後の区間」で締める。エラーだけ送ると main は待たずに締め、
      // 変換中の区間があれば捨てる（今は無いが、経路を揃えておく）
      if (mode === 'meeting') sendSegmentQueued(new Uint8Array(0), 0, true);
      window.koeOverlay.sendError('マイクにアクセスできません（OSのマイク許可を確認してください）');
      return;
    }
    // ここに来るまでに数秒かかることがある（相手の声の取り込み・デバイスの
    // オープン）。その間に「終了」「破棄」が押されていることがあるので、
    // 進む前にもう一度見る。見ないと、押したあともマイクと画面キャプチャを
    // 掴んだまま最初の区間が終わるまで（最大20秒）録り続ける。
    if (cancelled) { cleanup(); return; }
    if (stopping) {
      cleanup();
      // main は終了処理に入って最後の区間を待っている。空で閉じてやる。
      if (mode === 'meeting') sendSegmentQueued(new Uint8Array(0), 0, true);
      else window.koeOverlay.sendError('録音を開始できませんでした');
      return;
    }
    muteSystemForBeep();
    beep(SND.start);
    startedAt = Date.now();
    // 一時停止していた時間は会議の長さに含めない
    timerId = setInterval(() => {
      const pause = pausedMs + (paused ? Date.now() - pausedAt : 0);
      timerEl.textContent = (form === 'v' ? fmtV : fmt)(Date.now() - startedAt - pause);
    }, 250);

    if (mode === 'meeting') startMeetingSegment();
    else startDictation();
    if (mode === 'meeting' && twoEver && sysOn) startSysSegment();   // 0.12.0 SP-2: 相手の声の流れ
    starting = false;
    active = true;      // ここから先は active が二重起動を止める
  }

  // --- 音声入力（1本録り） ---
  function startDictation() {
    recorder = newRecorder(chunks);
    recorder.onstop = async () => {
      stopMeters();
      const durationMs = Date.now() - startedAt;
      if (cancelled) { cleanup(); return; }
      const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
      try {
        const wav = await blobToWav16k(blob);
        window.koeOverlay.sendAudio(wav, 'audio/wav', durationMs);
      } catch (e) {
        window.koeOverlay.sendError('音声の変換に失敗しました');
      }
      releaseStream();
    };
    // 上限時間で打ち切るときも通常の停止と同じ扱いにする。
    // recorder を直接止めると表示が「聞き取り中…」のまま変換に入り、
    // 話し続けてよいのか分からない見た目になる。
    autoStopId = setTimeout(() => {
      if (recorder && recorder.state === 'recording') stop();
    }, DICTATION_MAX_MS);
    recorder.start(250);
  }

  // --- 議事録（セグメント録り） ---
  // 画面が隠れると setTimeout は間引かれ、75秒の区切りが数分遅れることが
  // ある（実機で1区間が9分になり、文字起こしが時間切れで失われた）。
  // そこで区切りは3重に見張る: 通常の setTimeout、音声パイプラインが刻む
  // ondataavailable、そして間引かれない main からの overlay:tick。
  function cutSegmentIfOverdue(rec) {
    if (paused) return;
    cutSysIfOverdue();   // 0.12.0 SP-2: 相手の声の流れの区切りも同じ合図（overlay:tick・録音の刻み）で見張る
    if (!(mode === 'meeting' && segDeadline && Date.now() >= segDeadline + 2000
        && rec && rec === recorder && rec.state === 'recording' && !stopping && !cancelled)) return;
    // 遅延中の setTimeout を必ず消してから切る。消さないと、そのタイマーが
    // ID を失ったまま生き残り、あとから発火して「次の」区間を途中で切る。
    if (autoStopId) { clearTimeout(autoStopId); autoStopId = null; }
    rollSegment(rec);
  }

  // 区間を切り替える。締めた区間の変換と送信は onstop が裏で続けるので、ここでは
  // 待たずに次の区間を始める（#13: 変換の間に誰も録っていない空白をなくす。空白のぶん
  // atMs が会議の後半ほど手前へずれるのも直る）。
  // 上限時間の setTimeout、区切りの見張り（cutSegmentIfOverdue）、onstop の先頭から呼ぶ。
  function rollSegment(rec) {
    if (!rec || rec !== recorder) return;       // 既に切り替わっている／解放済み（二重に始めない）
    if (rec.state === 'recording') rec.stop();  // onstop を同期に呼ぶ実装では、この中で次が始まる
    if (recorder !== rec || stopping || cancelled || paused) return;
    startMeetingSegment();
  }

  // ---- 区間の待ち行列（#13）----
  // 番号順に main へ渡す。番号が飛んでいる間（前の区間がまだ変換中）は後の区間を溜める。
  // 番号は必ず埋める（送るものが無ければ null）。埋め忘れると、後の区間が永久に届かない。
  function settleSeg(seq, item) {
    if (seq < sendNext) return;   // 前の録音の番号（start() で待ち行列を捨てた後に届いた）
    sendQueue.set(seq, item);
    while (sendQueue.has(sendNext)) {
      const it = sendQueue.get(sendNext);
      sendQueue.delete(sendNext);
      sendNext++;
      if (!it) continue;
      const fin = finalOf('mic', it);
      if (it.meta) window.koeOverlay.sendSegment(it.wav, it.durationMs, fin, it.meta);
      else window.koeOverlay.sendSegment(it.wav, it.durationMs, it.isFinal);
      // マイクの切断は、最後の区間を送り「終えてから」伝える。先に伝えると main は
      // 締めに入り、変換中だった区間（最大75秒）を議事録の無いところへ届けて捨てる
      if (fin && errorAfterFinal) { const msg = errorAfterFinal; errorAfterFinal = ''; window.koeOverlay.sendError(msg); }
    }
  }
  // 区間を持たない送り（空の最後）も番号を取り、それまでに始まった区間の後に届ける
  // 0.12.0 SP-2: 2つの流れの録音では、空の最後にもマイクの流れの4つ目を付ける（その流れの最後）
  function sendSegmentQueued(wav, durationMs, isFinal) {
    if (twoEver) { settleSeg(segSeq++, { wav, durationMs, isFinal, meta: { src: '', seg: micSegNo++, t0: recClock(), last: Boolean(isFinal) } }); return; }
    settleSeg(segSeq++, { wav, durationMs, isFinal });
  }

  function startMeetingSegment() {
    if (autoStopId) { clearTimeout(autoStopId); autoStopId = null; }   // 前区間の消し忘れ保険
    // onstop は stop() の「後で」非同期に来る。その間に一時停止・終了・cleanup が
    // モジュール変数 recorder / chunks / segStart を差し替えたり null にしたりする
    // （実際に一時停止で recorder が null になり、onstop が落ちて区間が消えた）。
    // なので、この区間のものは全部ローカルに閉じ込め、onstop はそれだけを読む。
    const segChunks = [];
    const startedSeg = Date.now();
    segStart = startedSeg;
    const thisSegMs = firstSegDone ? segmentMs : FIRST_SEG_MS;
    firstSegDone = true;
    segDeadline = segStart + thisSegMs;
    const seq = segSeq++;          // 送る順を決める番号（#13）
    // 0.12.0 SP-2（決めたこと 121・122・124）: 2つの流れの録音では、マイクの流れの番号と始まりの時計。区間を始めるときに相手の声を
    // 取り込めていれば 'mic'、取り込みが切れた後に始めた区間は ''
    const myMeta = twoEver ? { src: sysOn ? 'mic' : '', seg: micSegNo++, t0: recClock() } : null;
    if (myMeta) micCur = myMeta.seg;
    const mySession = session;
    const rec = newRecorder(segChunks);
    recorder = rec;
    // 「この区間より後に始まった区間が無い」＝この区間が録音の末尾。マイクの解放・次の
    // 区間の開始・最後の印は、末尾の区間の onstop だけが受け持つ。切られて変換中の区間は
    // 変換して番号順に送るだけ（受け持つと、後の区間が録っている最中にマイクを手放したり、
    // 最後の印を付けて後の区間を main に捨てさせたりする）。
    const isLast = () => seq === segSeq - 1;
    rec.onstop = async () => {
      // 録れた長さ。変換の時間は含めない（main はこれを積んで atMs にする）
      const durationMs = Date.now() - startedSeg;
      let settled = false;
      const settle = (item) => { if (!settled) { settled = true; settleSeg(seq, item); } };
      // 前の録音の区間（破棄→すぐ次の録音、の間に onstop や変換が終わった）。今の録音の
      // マイクや区間には触らず、番号だけ空で埋める（埋めないと後の区間が永久に届かない）。
      if (mySession !== session) { settle(null); return; }
      let closing = null;
      const done = () => { if (closing && segClosing === closing) { segClosing = null; closing.resolve(); } };
      try {
        // 上限時間で切られた区間なら、変換を待たずにここで次の区間を始める（#13）。
        // 見張り（rollSegment）側で既に始めていれば何もしない。try の中で呼ぶ: ここで
        // 投げると（次の区間の start() がマイクの切断で落ちる等）finally が番号を埋める。
        // 外で投げると番号が埋まらず、以後の区間が永久に届かない
        rollSegment(rec);
        // 末尾の区間なら、送り終えるまでの印を立てる。一時停止側が先に立てていればそれを継ぐ。
        // 印が無いと、一時停止→終了で stop() が空の最後を先に送り、あとから届く本物の区間が
        // 最後の印の後になって main に捨てられる（最大75秒が消える）。
        if (isLast()) { if (!segClosing) segClosing = newClosing(); closing = segClosing; }
        if (cancelled) { cleanup(); return; }
        const blob = new Blob(segChunks, { type: rec.mimeType || 'audio/webm' });
        let wav = null;
        try {
          wav = await blobToWav16k(blob);
        } catch (e) { wav = null; }
        if (mySession !== session) return;   // 変換の間に次の録音が始まった。finally が番号を空で埋める
        // 変換の途中で「終了」「破棄」が押されていることがある。
        // 区切りの直前に決めた値のままだと、この区間を最後と扱えず次の録音が
        // 始まってしまい、マイクが開いたまま残る。変換後にもう一度見る。
        if (cancelled) { cleanup(); return; }
        // 最後の印は末尾の区間だけ。後の区間が録っていれば、終了の合図はそちらが受ける
        const isFinal = stopping && isLast();
        const meta = myMeta ? { ...myMeta, last: isFinal } : null;
        if (wav) settle(meta ? { wav, durationMs, isFinal, meta } : { wav, durationMs, isFinal });
        else if (isFinal) settle(meta ? { wav: new Uint8Array(0), durationMs, isFinal: true, meta } : { wav: new Uint8Array(0), durationMs, isFinal: true });
        if (!isLast()) return;               // 送るだけ。マイクと次の区間は末尾の区間が受け持つ
        if (!isFinal && paused) {
          // 一時停止で締めた区間（変換中に一時停止された区間も同じ）。区間を送り終えて
          // からマイクを解放する（先に解放すると、この onstop が読む recorder が消えている）。
          // 再開まで次の区間は始めない。
          releaseStream();
          return;
        }
        if (!isFinal) {
          // 変換を待つ間に一時停止→再開でストリームが差し替わっていることがある。
          // そのときは再開側がもう次の区間を始めている。ここでも始めると
          // 録音が2本走って区間が混ざる。
          if (recorder === rec) startMeetingSegment(); // 保険。通常は先頭の rollSegment が始めている
        } else {
          stopMeters();
          releaseStream();
        }
      } finally {
        // どの出口でも番号を埋め、印を倒す。埋め忘れると後の区間が永久に届かず、
        // 倒し忘れると待っている再開・終了が永久に動かない。
        settle(null);
        done();
      }
    };
    autoStopId = setTimeout(() => rollSegment(rec), thisSegMs);
    try {
      rec.start(250);
    } catch (e) {
      // マイクが抜かれた・トラックが終わった直後は start() が投げる（InvalidStateError 等）。
      // 投げたままにすると、この番号が埋まらず以後の区間（空の最後も）が永久に届かない。
      // この番号を「空の最後」で埋め（変換中の前の区間の後に届く）、録音を畳む。
      // main には最後の区間を送り終えてから伝える（settleSeg）。
      if (autoStopId) { clearTimeout(autoStopId); autoStopId = null; }
      stopping = true;
      errorAfterFinal = 'マイクが切断されました';
      if (recorder === rec) recorder = null;
      cleanup();
      setPhase('processing', '議事録を作成中…');
      settleSeg(seq, { wav: new Uint8Array(0), durationMs: 0, isFinal: true });
    }
  }

  // 区間を送り終えるまでの印。待つ側（resumeRec / 一時停止中の stop）は await し、
  // 送った側（onstop）が resolve する。
  function newClosing() {
    let resolve;
    const p = new Promise((r) => { resolve = r; });
    p.resolve = resolve;
    return p;
  }

  // ---- 0.12.0 SP-2: 相手の声の流れ（2つの流れの議事録。計画 docs/plans/2026-10-22-120.md の決めたこと 120〜122・124・130）----
  // 「録っている時間」の時計（一時停止の時間を除く）。区間ごとの t0 に使う（2つの録音の長さを別々に積むとずれるため: 決めたこと 124）
  function recClock() {
    const now = Date.now();
    return Math.max(0, now - startedAt - pausedMs - (paused ? now - pausedAt : 0));
  }
  function resetLanes() {
    twoEver = false;
    micSegNo = 0; micCur = -1; micLastSent = false;
    if (sys.timer) clearTimeout(sys.timer);
    sys.queue.clear();
    Object.assign(sys, { rec: null, no: 0, cur: -1, next: sys.seq, closing: null, deadline: 0, timer: null, first: false, ending: false, done: true, lastSent: true });
  }
  const sysMeta = (seg, t0, last) => ({ src: 'loopback', seg, t0, last });
  // isFinal（議事録の最後）は、2つの流れのどちらも最後を送った時の、後の方の区間だけ（決めたこと 130）。4つ目の無い区間は今のまま
  function finalOf(src, it) {
    if (!it.meta) return Boolean(it.isFinal);
    if (it.meta.last) { if (src === 'loopback') sys.lastSent = true; else micLastSent = true; }
    return Boolean(it.meta.last) && micLastSent && sys.lastSent;
  }
  // 番号順に main へ渡す（マイクの流れの settleSeg と同じ決まり。番号は必ず埋める）
  function settleSys(seq, item) {
    if (seq < sys.next) return;
    sys.queue.set(seq, item);
    while (sys.queue.has(sys.next)) {
      const it = sys.queue.get(sys.next);
      sys.queue.delete(sys.next);
      sys.next++;
      if (!it) continue;
      window.koeOverlay.sendSegment(it.wav, it.durationMs, finalOf('loopback', it), it.meta);
    }
  }
  // 相手の声の流れの区間を始める（マイクの流れの startMeetingSegment と同じ形。区間の時計は最初だけ 20 秒）
  function startSysSegment() {
    if (sys.timer) { clearTimeout(sys.timer); sys.timer = null; }
    if (!sysDest) return;
    const segChunks = [];
    const startedSeg = Date.now();
    const thisSegMs = sys.first ? segmentMs : FIRST_SEG_MS;
    sys.first = true;
    sys.deadline = startedSeg + thisSegMs;
    const seq = sys.seq++;
    const no = sys.no++;
    const t0 = recClock();
    sys.cur = no;
    sys.ending = false; sys.done = false; sys.lastSent = false;
    const mySession = session;
    const mime = pickMime();
    const srec = new MediaRecorder(sysDest.stream, mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 });
    srec.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) segChunks.push(e.data);
      cutSysIfOverdue();
    };
    sys.rec = srec;
    const isLast = () => seq === sys.seq - 1;
    srec.onstop = async () => {
      const durationMs = Date.now() - startedSeg;
      let settled = false;
      const settle = (item) => { if (!settled) { settled = true; settleSys(seq, item); } };
      if (mySession !== session) { settle(null); return; }
      let closing = null;
      const done = () => { if (closing && sys.closing === closing) { sys.closing = null; closing.resolve(); } };
      try {
        rollSysSegment(srec);
        if (isLast()) { if (!sys.closing) sys.closing = newClosing(); closing = sys.closing; }
        if (cancelled) return;
        const blob = new Blob(segChunks, { type: srec.mimeType || 'audio/webm' });
        let wav = null;
        try { wav = await blobToWav16k(blob); } catch (e) { wav = null; }
        if (mySession !== session || cancelled) return;
        // その流れの最後: 終了のとき・トラックが終わったとき（決めたこと 122・130）。後の区間が録っていれば、そちらが受ける
        const last = isLast() && (stopping || sys.ending);
        if (last) sys.done = true;
        if (wav) settle({ wav, durationMs, meta: sysMeta(no, t0, last) });
        else if (last) settle({ wav: new Uint8Array(0), durationMs, meta: sysMeta(no, t0, true) });
      } finally {
        settle(null);
        done();
      }
    };
    sys.timer = setTimeout(() => rollSysSegment(srec), thisSegMs);
    try {
      srec.start(250);
    } catch (e) {
      // 相手の声のトラックが終わった直後は start() が投げる。その流れを空の最後で閉じる（マイクの流れは続ける）
      if (sys.timer) { clearTimeout(sys.timer); sys.timer = null; }
      if (sys.rec === srec) sys.rec = null;
      sys.cur = -1; sys.done = true;
      settleSys(seq, { wav: new Uint8Array(0), durationMs: 0, meta: sysMeta(no, t0, true) });
    }
  }
  function rollSysSegment(rec) {
    if (!rec || rec !== sys.rec) return;
    if (rec.state === 'recording') rec.stop();
    if (sys.rec !== rec || stopping || cancelled || paused || sys.ending || !sysOn) return;
    startSysSegment();
  }
  // 区切りの見張り（マイクの流れの cutSegmentIfOverdue と同じ。setTimeout が間引かれても main の overlay:tick と録音の刻みで切る）
  function cutSysIfOverdue() {
    if (paused) return;
    const rec = sys.rec;
    if (!(mode === 'meeting' && sys.deadline && Date.now() >= sys.deadline + 2000 && rec && rec.state === 'recording' && !stopping && !cancelled)) return;
    if (sys.timer) { clearTimeout(sys.timer); sys.timer = null; }
    rollSysSegment(rec);
  }
  // 相手の声のトラックが終わった: 今の区間を締めて送る（その流れの最後）
  function endSysLane() {
    if (sys.timer) { clearTimeout(sys.timer); sys.timer = null; }
    sys.ending = true;
    sys.cur = -1;
    if (sys.rec && sys.rec.state === 'recording') sys.rec.stop();
    else closeSysEmpty();
  }
  // 一時停止: 相手の声の流れの区間も締めて送る（その流れの最後ではない。再開で開き直す）
  function closeSysForPause() {
    if (sys.timer) { clearTimeout(sys.timer); sys.timer = null; }
    sys.deadline = 0;
    if (sys.rec && sys.rec.state === 'recording') { sys.closing = newClosing(); sys.rec.stop(); }
  }
  // 相手の声の流れがまだ最後を並べていなければ、空の最後で閉じる（締めの区間が無いとき: 一時停止の間の終了・取り込めなかった再開）
  function closeSysEmpty() {
    if (sys.done) return;
    sys.done = true;
    sys.cur = -1;
    settleSys(sys.seq++, { wav: new Uint8Array(0), durationMs: 0, meta: sysMeta(sys.no++, recClock(), true) });
  }

  // 一時停止。録音そのものを止め、それまでの区間はきちんと締めて送る。
  // 中途半端に持ったまま止めると、再開までの分が同じ区間に混ざり、
  // 一時停止した意味が無くなる。
  function pauseRec() {
    if (paused || mode !== 'meeting' || stopping || cancelled) return;
    paused = true;
    pausedAt = Date.now();
    pill.classList.add('paused');
    if (autoStopId) { clearTimeout(autoStopId); autoStopId = null; }
    segDeadline = 0;
    stopMeters();                 // 波形とマイクの見張りを止める
    if (recorder && recorder.state === 'recording') {
      // 区間を締めて送る。onstop は後で来るので、マイクの解放（releaseStream）は
      // 区間を送った後に onstop 側で行う。ここで解放すると onstop が落ちて区間が消える。
      segClosing = newClosing();
      recorder.stop();
      closeSysForPause();          // 0.12.0 SP-2: 相手の声の流れも締める
    } else if (!segClosing) {
      releaseStream();            // マイクを解放する。停止中に録っていないことを機器の表示でも示す
    }
    // segClosing が立ったまま＝上限時間で切られた区間がまだ変換中（recorder は止まって
    // 見える）。マイクの解放はその onstop に任せる。送り終えた onstop が paused を見て
    // 解放し、終了が押されていればその区間を最後として送る。印ではなく recorder の
    // 状態で判断すると、stop() も待つものが無いと思って空の最後を先に送ってしまう。
    // 0.9.0 O-3: 一時停止中は灰色の平らな点・薄い時間・白い丸の［▶］（文は出さない。無音の警告も消す）
    showRecording('');
    window.koeOverlay.reportPause(true);
  }

  async function resumeRec() {
    if (!paused || stopping || cancelled) return;
    // 一時停止で締めた区間がまだ送り終えていなければ待つ。待たずにマイクを
    // 開き直すと、前の区間の onstop が新しいストリームを解放してしまう。
    if (segClosing) {
      await segClosing;
      if (!paused || stopping || cancelled) return;   // 待つ間に終了・破棄・二重押しされている
    }
    if (sys.closing) {             // 0.12.0 SP-2: 相手の声の流れの締めも送り終えてから
      await sys.closing;
      if (!paused || stopping || cancelled) return;
    }
    pausedMs += Date.now() - pausedAt;
    paused = false;
    pill.classList.remove('paused');
    try {
      await openStream();         // マイクを開き直す
    } catch (e) {
      paused = true; pausedAt = Date.now(); pill.classList.add('paused');
      setPhase('recording', 'マイクを開けませんでした。もう一度お試しください');
      return;
    }
    if (stopping || cancelled) {
      // 開き直している間に「終了」が押された。paused を倒した後なので stop() は
      // 何も送っていない。main は最後の区間を待っているので、空で閉じてやる。
      cleanup();
      if (stopping) { closeSysEmpty(); sendSegmentQueued(new Uint8Array(0), 0, true); }
      return;
    }
    firstSegDone = true;          // 再開後は通常の区間長で刻む
    startMeetingSegment();
    // 0.12.0 SP-2（決めたこと 122）: 取り込めれば相手の声の流れも始め、取り込めなければその流れを空の最後で閉じる（以後のマイクの区間は ''）
    if (twoEver && sysOn) { sys.first = true; startSysSegment(); } else closeSysEmpty();
    setPhase('recording');
    window.koeOverlay.reportPause(false);
  }

  function stop() {
    // 一時停止中は録音が止まっているので、そのまま締める
    if (paused) {
      paused = false;
      pausedMs += Date.now() - pausedAt;
      pill.classList.remove('paused');
      stopping = true;
      setPhase('processing', mode === 'meeting' ? '議事録を作成中…' : '文字起こし中…');
      beep(SND.stop);
      // 一時停止で締めた区間（または上限時間で切られて変換中の区間）がまだ
      // 送り終えていなければ、その onstop が（stopping を見て）この区間を最後として
      // 送り、マイクも解放する。ここでも空の最後を送ると最後の区間が二重に届き、
      // 後から届く本物の区間が main に捨てられる。
      // 0.12.0 SP-2: 相手の声の流れも同じ（締め待ちの区間が無ければ空の最後で閉じる）
      if (!sys.closing) closeSysEmpty();
      if (segClosing) return;
      // 切られて変換中の区間が残っていれば、その後に届くよう待ち行列を通す（#13）
      sendSegmentQueued(new Uint8Array(0), 0, true);
      cleanup();
      return;
    }
    stopping = true;
    if (autoStopId) clearTimeout(autoStopId);
    // 0.9.4 P-1（F2・持ち主「そのまますっと消える」）: 議事録はその場で薄くなって消える（「議事録を作成中…」を出さない）。音声入力は貼るまで待つので今のまま
    if (mode === 'meeting') { sysNg = false; flashMsg(''); fadeOut(); } else setPhase('processing', '文字起こし中…');
    muteSystemForBeep();   // 終了のビープを最後の区間に録り込まない
    beep(SND.stop);
    if (recorder && recorder.state === 'recording') recorder.stop();
    // 0.12.0 SP-2: 相手の声の流れの最後（録っていなければ、締め待ちの区間が無いときだけ空の最後で閉じる）
    if (sys.rec && sys.rec.state === 'recording') { if (sys.timer) { clearTimeout(sys.timer); sys.timer = null; } sys.rec.stop(); }
    else if (!sys.closing) closeSysEmpty();
  }

  function cancel() {
    cancelled = true;
    if (autoStopId) clearTimeout(autoStopId);
    setPhase('error', 'キャンセルしました');
    beep(SND.cancel);
    if (sys.rec && sys.rec.state === 'recording') sys.rec.stop();   // 0.12.0 SP-2（cancelled を見て何も送らない）
    if (recorder && recorder.state === 'recording') recorder.stop();

    setTimeout(() => pill.classList.remove('visible'), 400);
    setTimeout(() => window.koeOverlay.requestHide(), 650);
  }

  // 音が入っていないまま録り続けていないか見張る。
  // 表示を書き換えるだけで、録音そのものには手を触れない。
  // 相手の声も録っているときは、どちらかに音が入っていれば無音ではない。
  // 聞き役に回っている間じゅう警告を出すと、本当にマイクが死んだときに
  // 誰も見なくなる。一方、マイクだけが死んでいる状態は相手の声に隠れるので、
  // そちらは別に数える（自分の発言が会議まるごと欠ける）。
  function checkSilence(micLevel, sysLevel) {
    if (stopping || cancelled || paused || pill.dataset.phase !== 'recording') return;
    const now = Date.now();
    const level = Math.max(micLevel, sysLevel || 0);

    if (level > SILENT_LEVEL) silentSince = 0;
    else if (silentSince === 0) silentSince = now;

    if (micLevel > SILENT_LEVEL) micSilentSince = 0;
    else if (micSilentSince === 0) micSilentSince = now;

    // 両方無音の方を優先する。マイクだけの警告より事態が重い。
    let label = '';
    if (silentSince && now - silentSince >= SILENT_WARN_MS) {
      label = '音が入っていません';
    } else if (sysOn && micSilentSince && now - micSilentSince >= MIC_SILENT_WARN_MS) {
      label = 'マイクの音が入っていません';
    }
    if (label !== shownLabel) showRecording(label);
  }

  function stopMeters() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    if (timerId) clearInterval(timerId);
    timerId = null;
    if (autoStopId) clearTimeout(autoStopId);
    autoStopId = null;
    if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
    analyser = null;
    sysAnalyser = null;
    sysDest = null;
    micVoice = null;
    sysVoice = null;
    sysGain = null;
    if (sys.timer) { clearTimeout(sys.timer); sys.timer = null; }
    renderLevel(0);   // 点を平らに戻す（一時停止中・止めた後）
  }
  function releaseStream() {
    // 実デバイスを掴んでいるのは micStream と sysStream。mediaStream は
    // micStream と同一なので（0.12.0 SP-2: 相手の声の流れの出口 sysDest は audioCtx.close で終わる）、
    // 3本まとめて止めても二重 stop になるだけで無害。
    // ここで micStream を落とし忘れると、録音が終わってもマイクが開いたままになり、
    // OS のマイク使用表示が点きっぱなしになる。
    for (const st of [micStream, sysStream, mediaStream]) {
      if (st) st.getTracks().forEach((t) => t.stop());
    }
    micStream = null;
    sysStream = null;
    mediaStream = null;
    sysOn = false;
    recorder = null;
    // 音声入力の正常終了は cleanup を通らず、ここだけを通る。
    // 倒し忘れると次の録音が永久に始まらない。
    starting = false;
    active = false;
  }
  function cleanup() {
    stopMeters();
    releaseStream();   // starting / active はここで倒れる
    chunks = [];
  }

  document.getElementById('pauseBtn').addEventListener('click', () => {
    if (mode !== 'meeting') return;
    if (paused) resumeRec(); else pauseRec();
  });
  document.getElementById('stopBtn').addEventListener('click', () => window.koeOverlay.confirmStop());
  document.getElementById('ngBtn').addEventListener('click', () => window.koeOverlay.requestCancel());

  // main からは IPC と executeJavaScript の2経路で来る。両方ここへ合流させる。
  // getDisplayMedia は「ユーザー操作の直後」を求めることがあり、
  // IPC 経由だとその扱いにならない場合があるため。
  window.__koeStart = (p) => {
    // main は executeJavaScript と IPC の2経路で呼ぶ（前者が失敗したら後者）。
    // 両方届くと MediaRecorder が2つになり、chunks が混ざって全区間が壊れる。
    if (starting || active) return;
    mode = (p && p.mode) || 'dictation';
    segmentMs = ((p && p.segmentSec) || 75) * 1000;
    micId = (p && p.micId) || '';
    soundOn = !p || p.sound !== false;
    // 音声入力（1本録り）は常にマイクだけ。合成は議事録のときだけ。
    sysWanted = mode === 'meeting' && Boolean(p && p.systemAudio);
    sysOn = false;
    // 0.9.0 O-3: 形（main が置き場所で決める）と、ボタンの名前に入れる近道のキー（文字だけ・短いものだけ）
    const k = p && p.keys && typeof p.keys === 'object' ? p.keys : {};
    keys = {};
    for (const n of ['stop', 'cancel']) if (typeof k[n] === 'string' && k[n] && k[n].length <= 40) keys[n] = k[n];
    if (p && p.form) applyForm(p.form);
    setHover(false);   // 0.9.0 O-4: 前の録音でカーソルが乗っていた印を持ち越さない
    pill.classList.remove('leaving');
    pill.classList.add('visible');
    start();
  };
  window.koeOverlay.onStart((p) => window.__koeStart(p));
  window.koeOverlay.onTick(() => cutSegmentIfOverdue(recorder));
  // 0.12.0 SP-2（決めたこと 123・134）: main が声の切れ目で「この流れのこの番号の区間を切る」と言う。議事録の2つの流れで録っていて、
  // 一時停止・終了・取り消しの途中でなく、その流れの今の区間の番号が seg と同じときだけ、今の区切りの道（rollSegment）で切る
  if (typeof window.koeOverlay.onCut === 'function') {
    window.koeOverlay.onCut((p) => {
      if (!p || typeof p !== 'object' || mode !== 'meeting' || !active || !twoEver || paused || stopping || cancelled) return;
      if (p.src === 'mic') {
        if (p.seg !== micCur || !recorder) return;
        if (autoStopId) { clearTimeout(autoStopId); autoStopId = null; }
        rollSegment(recorder);
      } else if (p.src === 'loopback') {
        if (p.seg !== sys.cur || !sys.rec) return;
        if (sys.timer) { clearTimeout(sys.timer); sys.timer = null; }
        rollSysSegment(sys.rec);
      }
    });
  }
  // #8/#42 main が文字起こしの詰まり具合で区間長を上げ下げする（背圧）。効くのは次の区間から。
  // 今の区間は切らない（受けた瞬間に切ると短い区間ができ、文脈が細切れになる）。
  // 録音の開始時は onStart の segmentSec で戻るので、main は開始後に送る。
  // preload がまだ公開していない版でも動くよう、有無を見てから結線する。契約:
  //   onSegmentMs: (cb) => ipcRenderer.on('overlay:segment-ms', (_e, ms) => cb(ms))
  if (typeof window.koeOverlay.onSegmentMs === 'function') {
    window.koeOverlay.onSegmentMs((ms) => {
      if (typeof ms !== 'number' || !Number.isFinite(ms)) return;   // 数でないものは無視
      segmentMs = Math.min(SEG_MAX_MS, Math.max(SEG_MIN_MS, Math.round(ms)));
    });
  }
  window.koeOverlay.onStop(() => stop());
  window.koeOverlay.onCancel(() => cancel());
  // 0.9.0 O-2・O-3: 形の替わり（main がドラッグの吸い付きで決める）。ピルの大きさが替われば測って送る（ResizeObserver が無ければ書き換えのたびに）
  if (typeof window.koeOverlay.onForm === 'function') window.koeOverlay.onForm((p) => applyForm(p && p.form));
  // 0.9.0 O-4（RP8）: カーソルがピルに乗ったか（main が縦の形の録音中だけ見て、変わったときだけ送る）と、× で隠す（録音は止めない）
  if (typeof window.koeOverlay.onHover === 'function') window.koeOverlay.onHover((on) => setHover(on));
  // 0.9.3 M-5（問い Q1 の答えで、この受け口だけを足した）: main が録音中のページの音の波のために聞く（10 回／秒）。毎フレームの描き（隠した窓では止まる）
  // でなく受け口で答える。mic・sys は点と同じ rmsOf の値（analyser が無い録音の前・一時停止は 0）、warn は今出している無音の警告の文
  if (typeof window.koeOverlay.onLevelAsk === 'function') {
    window.koeOverlay.onLevelAsk(() => window.koeOverlay.reportLevel({
      mic: analyser ? rmsOf(analyser) : 0, sys: analyser && sysAnalyser ? rmsOf(sysAnalyser) : 0, warn: typeof shownLabel === 'string' ? shownLabel : '',
      ...(twoEver ? voiceAnswer() : {}) }));
  }
  // 0.12.0 SP-2（決めたこと 134・146）: 2つの流れの録音だけ、声を見る analyser の大きさと、今録っている区間の番号（録っていなければ -1）と取り込みの有無
  function voiceAnswer() {
    const recMic = Boolean(recorder && recorder.state === 'recording' && !paused);
    const recSys = Boolean(sys.rec && sys.rec.state === 'recording' && sysOn && !paused);
    return { vMic: micVoice && recMic ? rmsOf(micVoice) : 0, vSys: sysVoice && recSys ? rmsOf(sysVoice) : 0,
      segMic: recMic ? micCur : -1, segSys: recSys ? sys.cur : -1, sysOk: Boolean(sysAnalyser && sysOn) };
  }
  hideBtn.addEventListener('click', () => { if (typeof window.koeOverlay.hidePanel === 'function') window.koeOverlay.hidePanel(); });
  if (typeof ResizeObserver === 'function') new ResizeObserver(() => reportSize()).observe(pill);
  window.koeOverlay.onPhase(({ phase, message, procSec }) => {
    setPhase(phase, message, procSec);
    if (phase === 'done') {
      beep(SND.done);   // 0.9.4 P-1（F3）: 保存の音は残す
      fadeOut();
    } else if (phase === 'error') {
      beep(SND.error);
      pill.classList.remove('leaving');   // 0.9.4 P-1: 止めて薄く消えた後のエラーも見せる
      pill.classList.add('visible');
      setTimeout(() => pill.classList.remove('visible'), 2800);
    }
  });
})();
</script>
</body>
