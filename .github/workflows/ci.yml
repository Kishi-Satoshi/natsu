# プッシュと PR ごとに、Linux と Windows で検査する。
#
#  - 両方の OS で npm test と変更危険度ゲートを回す。
#  - Windows ではさらに、.ps1 を Windows PowerShell 5.1（配布先が使う版）で
#    構文解析し、BOM と CRLF を確かめる。
#
# release.yml からも workflow_call で呼ぶ。リリースは、その commit で
# 両方の OS が緑のときだけ出す。
# 呼ばれた側で待ち合わせが起きないよう、top-level の concurrency は置かない。
name: ci

on:
  push:
    branches:
      - '**'
      - '!release/**' # release/natsu-v* は release.yml が ci を呼ぶので、ここでは動かさない
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false # 片方が落ちても、もう片方の結果を見られるようにする
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      # checkout より前に止める。Windows の既定（autocrlf=true）のまま取ると、
      # 改行が CRLF に変わり、\n を探すテストが落ちる。
      - name: 改行の変換を止める
        shell: bash
        run: git config --global core.autocrlf false

      # 履歴ごと取る。gate.test.js が古いコミットを読み、ゲートが前の commit と比べる。
      - name: 取り出す（履歴ごと）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # package.json の test は glob（"test/*.test.js"）を node に渡す。Node 21 以上が要る。出力は TAP に固定してある（Node 23 から既定が spec になり、「# skipped」の行が出なくなる）。
      - name: Node を用意する
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 追加の npm 依存は無いので install は要らない（テストは Node 同梱のランナー）。
      # 飛ばしたテストの数も見る。許すのは Linux で 0 件、Windows で 1 件
      # （stage3.infra.test.js の pre-commit を sh で実際に走らせるテスト。Windows には sh が無い）。
      # 環境のせいで静かに飛ばされるテストが増えたら、ここで止める。
      # Windows では一時フォルダ（os.tmpdir()）を作業のディスク（RUNNER_TEMP。D:）に置く（CI の直し: run 39583796615）。
      # 既定の %TEMP% は C:（OS のディスク）で、場面（mainrun）の DB・JSON の fsync とファイルを多く書くテストが2〜4倍遅くなり
      # （CPU だけを使うゲートのテストは同じ速さ）、場面が見張り（19〜20 秒）に当たった。場面を同時に走らせる数は test/helpers/scene-slots.js が決める
      - name: テスト
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            mkdir -p "$RUNNER_TEMP/natsu-tmp"
            export TEMP="$(cygpath -w "$RUNNER_TEMP/natsu-tmp")" TMP="$(cygpath -w "$RUNNER_TEMP/natsu-tmp")"
            node -p "'一時フォルダ: ' + require('os').tmpdir()"
          fi
          LOG="$RUNNER_TEMP/npm-test.log"
          npm test 2>&1 | tee "$LOG"
          SKIPPED="$(grep -E '^# skipped [0-9]+' "$LOG" | tail -n 1 | sed -E 's/^# skipped ([0-9]+).*/\1/' || true)"
          ALLOW=0
          if [ "$RUNNER_OS" = "Windows" ]; then ALLOW=1; fi
          if [ -z "$SKIPPED" ]; then
            echo "::error::npm test の出力に「# skipped」の行が無い"
            exit 1
          fi
          echo "飛ばしたテスト: ${SKIPPED} 件（${RUNNER_OS} で許すのは ${ALLOW} 件まで）"
          if [ "$SKIPPED" -gt "$ALLOW" ]; then
            echo "::error::飛ばしたテストが ${SKIPPED} 件ある（${RUNNER_OS} で許すのは ${ALLOW} 件まで）"
            exit 1
          fi

      # 速さの目安（第1a回 PERF）。5,000 ページの見本は npm test の 1 つ 5 秒に入らないので、ここで計る。
      # Windows の値は、まとめ書きの間隔と draft.json の fsync を決める材料にもする（出力の「決め方」の行）
      - name: 速さを計る
        shell: bash
        run: node tools/perf.js

      # 「前の状態 → この commit」の差分をゲートに通す。
      # 素の npm run gate は作業ツリーとしか比べないので、CI では必ず 0 件になる。
      # 基準: PR なら分かれた点、push なら push の前の commit。
      # risk.js は基準をそのまま git diff に渡すので、使えない基準だと落ちる。
      # 使えない基準（空・0 の並び・履歴に無い・HEAD と同じ）は HEAD^ にし、それも無ければ最初の commit にする。
      #   0 の並び: 新しいブランチの push と、タグの push（release.yml から呼ばれるリリースの道）
      #   履歴に無い: force-push の後
      - name: 変更危険度ゲート
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null || true)"
          else
            BASE="$EVENT_BEFORE"
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
             || [ "$(git rev-parse "$BASE^{commit}")" = "$HEAD_SHA" ]; then
            echo "基準「${BASE}」は使えないので、HEAD^ にする"
            BASE="$(git rev-parse --verify --quiet 'HEAD^' || git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          echo "基準: $BASE"
          node tools/risk.js --base "$BASE" --head HEAD

      # .ps1 を Windows PowerShell 5.1（Desktop 版）で構文解析する。PowerShell 7 ではない。
      # ParseFile は BOM を見て読む。加えて、CP932（日本語の Windows の既定）を指定して読んだ文字も解析する。
      # BOM があれば UTF-8 として、無ければ CP932 として読まれる。日本語の PC での読まれ方に合わせるため。
      # run の中の文字は ASCII だけにする（PowerShell 5.1 がこの台本そのものを読み違えないように）。
      - name: .ps1 を PowerShell 5.1 で構文解析する（Windows）
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $v = $PSVersionTable
          if ($v.PSEdition -ne 'Desktop' -or $v.PSVersion.Major -ne 5) {
            Write-Output "::error::Not Windows PowerShell 5.1: $($v.PSEdition) $($v.PSVersion)"
            exit 1
          }
          Write-Output "PowerShell $($v.PSVersion) ($($v.PSEdition))"
          $files = @(git ls-files -- '*.ps1')
          if ($files.Count -eq 0) {
            Write-Output '::error::No tracked .ps1 files'
            exit 1
          }
          $cp932 = [System.Text.Encoding]::GetEncoding(932)
          $bad = 0
          foreach ($f in $files) {
            $p = Join-Path (Get-Location).Path $f
            $tokens = $null
            $perr = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($p, [ref]$tokens, [ref]$perr)
            foreach ($e in $perr) {
              Write-Output "::error file=${f},line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $bad++
            }
            $text = [System.IO.File]::ReadAllText($p, $cp932)
            [void][System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$tokens, [ref]$perr)
            foreach ($e in $perr) {
              Write-Output "::error file=${f},line=$($e.Extent.StartLineNumber)::(read as CP932) $($e.Message)"
              $bad++
            }
            Write-Output "parsed: ${f}"
          }
          if ($bad -gt 0) {
            Write-Output "::error::${bad} parse error(s) in .ps1 files"
            exit 1
          }

      # 取り出した .ps1 のバイトが BOM（EF BB BF）付きで、行末が全部 CRLF であること。
      # 索引の側（git ls-files --eol の i/）も CRLF であること。
      # run の中の文字は ASCII だけにする（上と同じ理由）。
      - name: .ps1 の BOM と CRLF を確かめる（Windows）
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $bad = 0
          $files = @(git ls-files -- '*.ps1')
          foreach ($f in $files) {
            $b = [System.IO.File]::ReadAllBytes((Join-Path (Get-Location).Path $f))
            if ($b.Length -lt 3 -or $b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) {
              Write-Output "::error file=${f}::No UTF-8 BOM (EF BB BF)"
              $bad++
            }
            $lf = 0
            $crlf = 0
            for ($i = 0; $i -lt $b.Length; $i++) {
              if ($b[$i] -eq 10) {
                $lf++
                if ($i -gt 0 -and $b[$i - 1] -eq 13) { $crlf++ }
              }
            }
            if ($lf -ne $crlf) {
              Write-Output "::error file=${f}::Not CRLF: ${crlf} of ${lf} line endings are CRLF"
              $bad++
            }
          }
          $eol = @(git ls-files --eol -- '*.ps1')
          if ($eol.Count -ne $files.Count) {
            Write-Output "::error::git ls-files --eol listed $($eol.Count) of $($files.Count) .ps1 files"
            $bad++
          }
          foreach ($line in $eol) {
            if (-not $line.StartsWith('i/crlf ')) {
              Write-Output "::error::Not i/crlf in the index: ${line}"
              $bad++
            }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Output "$($files.Count) .ps1 file(s): BOM and CRLF OK"

  # 取り込むエンジンの本物を確かめる（第0b回 Task 8。RF1・RF10）。tools/engine-smoke.js の頭の注釈も見る。
  #  - --pins:  ピンの全部の取得元に Range: bytes=0-0 で届き、206 の総量がピンの大きさと同じか。
  #             Hugging Face は転送の x-linked-etag と x-repo-commit がピンと同じか（上流が資産を消していないか）。
  #  - --start: é・日本語・𠮷 の名前のフォルダに、アプリと同じ道（fetchFile → zipread → engineSpawnPlan）で
  #             エンジンを置いて起動し、VAD を読ませる。英数字以外の絶対パスでは落ちることも見る。
  #             本物の CDN で、取り消してから続きを取れるか（206）も、キャッシュがあっても毎回見る。
  # 要約のモデル（約 5GB）は落とさない。届くかと記録が合うかだけを見る。
  # キャッシュは SHA-256 を照らしてから使う（合わなければ取り直す）。
  engine-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # checkout より前に止める（test のジョブと同じ理由）
      - name: 改行の変換を止める
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 取り込んだものを覚えておく（SHA-256 で照らしてから使う）
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/engine-cache
          key: engine-smoke-${{ hashFiles('src/engine-manifest.js', 'tools/engine-smoke.js') }}

      - name: ピンの取得元に届くか（大きさと SHA-256 の記録）
        shell: bash
        run: node tools/engine-smoke.js --pins

      - name: 日本語の名前のフォルダでエンジンを起動する（RF1）
        shell: bash
        run: node tools/engine-smoke.js --start

  # 本物の Electron 31 の net.request が、取り込み（src/engine-fetch.js の fetchFile）とテストの偽物
  # （test/helpers/fake-net.js）の前提どおりに動くかを、Windows で確かめる（第0b回 RF2）。
  # 127.0.0.1 の偽の取得元と CDN だけを使う（外へはつながない）。結果は 1 行ずつ OK／NG で出る。
  # Electron は一時フォルダに入れる（リポジトリの依存は変えない）。
  electron-net:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 改行の変換を止める
        shell: bash
        run: git config --global core.autocrlf false

      - name: 取り出す
        uses: actions/checkout@v4

      - name: Node を用意する
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 版は作業フォルダ（リポジトリ）で読んでから移る。$GITHUB_WORKSPACE を JS の文字列に埋めると、
      # Windows のパスの \a \n が文字の印として読まれて壊れるため。
      - name: Electron を一時フォルダに入れる（package.json の devDependencies と同じ指定）
        shell: bash
        run: |
          VER="$(node -p "require('./package.json').devDependencies.electron")"
          mkdir -p "$RUNNER_TEMP/el" && cd "$RUNNER_TEMP/el" && npm init -y >/dev/null && npm install --no-audit --no-fund "electron@$VER"

      # Electron 42 から npm install では本体が落ちてこない（第0c回 EL8・EL9）。install.js は Electron の包みの
      # 取り込みの台本で、本体があれば何もせず 0 で終わる（31 でも 44 でも同じ道。npx で install-electron を呼ばない。
      # 31 の包みにはその名前が無く、npm には同じ名前の別の包みがあるため）
      - name: Electron の本体を取り込む
        shell: bash
        run: cd "$RUNNER_TEMP/el" && node node_modules/electron/install.js

      # 1 つでも NG なら終了コード 1。どこかで止まっても 120 秒の見張りで 1 になる。
      - name: 本物の Electron の net.request が、取り込みの前提どおりに動くか
        shell: bash
        run: '"$RUNNER_TEMP/el/node_modules/electron/dist/electron.exe" tools/net-smoke.js'

  # 配る Electron（package.json の版）を Windows で本当に動かす（第0c回 EL6・EL8。RF13・RF15）。
  #  - node_modules の Electron を Node として（ELECTRON_RUN_AS_NODE=1）node:sqlite・FTS5 trigram・backup() を見る
  #  - electron-builder で NSIS とポータブルを作り、詰めた NaTsu.exe でも同じ煙テストを走らせる
  #    （配る exe で node:sqlite が動くことと、exe を Node として起動できる設定〔RunAsNode〕が切られていないこと）
  # 履歴ごと取る（Task 14 でテスト全部をここでも回す。gate.test.js が古いコミットを読む）
  electron-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 改行の変換を止める
        shell: bash
        run: git config --global core.autocrlf false

      - name: 取り出す（履歴ごと）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node を用意する
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 依存を入れる（electron / electron-builder）
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Electron の本体を取り込む
        shell: bash
        run: node node_modules/electron/install.js

      - name: node_modules の Electron で node:sqlite・trigram・backup() を確かめる
        shell: bash
        run: ELECTRON_RUN_AS_NODE=1 node_modules/electron/dist/electron.exe tools/sqlite-probe.js

      - name: 小さなアプリで utilityProcess・sandbox の窓など（1〜7）、守り（8〜12）、net.request の POST・safeStorage（13・14）を確かめる
        shell: bash
        run: node_modules/electron/dist/electron.exe tools/electron-smoke

      # 0.9.0 O-2（RP4・F11）: 録音バーの窓（透過・resizable: false・focusable: false）の setBounds が、拡大率 125% でも getBounds にそのまま返るか（17）
      - name: 録音バーの窓の大きさ（17）を拡大率 1.25 でも確かめる
        shell: bash
        run: node_modules/electron/dist/electron.exe tools/electron-smoke --only=17 --scale=1.25

      # 主な画面を撮り、基準（test/shots/win32。Windows の CI が撮った画像を確かめて置いたもの）と比べる（第1a回 G2・Task 3-5）。
      # 違えば前・後・差分を artifact に上げる。画面を変えた回は、確かめてから基準を取り直す（--compare を外して撮り直す）
      - name: 主な画面を撮る
        shell: bash
        run: node_modules/electron/dist/electron.exe tools/shots --compare test/shots/win32 --out "$RUNNER_TEMP/shots"

      - name: 撮った画面を上げる
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

      # CI の Node（24）とアプリの Node（Electron 44 の 24.22）の違いを早く見つける（RF15）。飛ばすのは 1 件まで（test のジョブと同じ）
      # 一時フォルダは test のジョブと同じく作業のディスク（RUNNER_TEMP。D:）に置く（CI の直し: run 39583796615）
      - name: テスト全部を Electron の Node（ELECTRON_RUN_AS_NODE=1）でも回す
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/natsu-tmp"
          export TEMP="$(cygpath -w "$RUNNER_TEMP/natsu-tmp")" TMP="$(cygpath -w "$RUNNER_TEMP/natsu-tmp")"
          LOG="$RUNNER_TEMP/electron-node-test.log"
          ELECTRON_RUN_AS_NODE=1 node_modules/electron/dist/electron.exe --test --test-reporter=tap "test/*.test.js" 2>&1 | tee "$LOG"
          SKIPPED="$(grep -E '^# skipped [0-9]+' "$LOG" | tail -n 1 | sed -E 's/^# skipped ([0-9]+).*/\1/' || true)"
          if [ -z "$SKIPPED" ] || [ "$SKIPPED" -gt 1 ]; then echo "::error::飛ばしたテストが ${SKIPPED:-?} 件（許すのは 1 件まで）"; exit 1; fi

      # 0.10.0 PB-1（D76）: ポータブル版は作らない（最後は 0.9.4）
      - name: NSIS を作る
        shell: bash
        run: node_modules/.bin/electron-builder --win nsis --publish never

      - name: 詰めた NaTsu.exe で node:sqlite・trigram・backup() を確かめる
        shell: bash
        run: |
          ls -l dist/*-setup.exe
          ELECTRON_RUN_AS_NODE=1 dist/win-unpacked/NaTsu.exe tools/sqlite-probe.js

  # 変異確認（第1a回 G3）。tools/mutants.js の変異を1つずつ当て、決めたテストが赤になるか（殺せるか）を見る。
  # 生き残り・当たらない変異が1つでもあれば赤。release.yml は ci.yml を呼ぶので、リリースも止まる
  mutate:
    runs-on: ubuntu-latest
    # 0.9.0 G-1: 0.8.0 で 16 分 41 秒（650 の変異）。0.9.0 で約 99 足すと 20 分を越える見込みなので 40 分に（30 分を越えたら --jobs か pattern を見直す）
    timeout-minutes: 40
    steps:
      - name: 改行の変換を止める
        shell: bash
        run: git config --global core.autocrlf false

      - name: 取り出す（履歴ごと）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node を用意する
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 写しは2つまで（非公開のリポジトリの ubuntu-latest は CPU が 2 つ。混むと場面のテストが見張りに当たる）
      - name: 変異確認
        shell: bash
        run: node tools/mutate.js --jobs 2
